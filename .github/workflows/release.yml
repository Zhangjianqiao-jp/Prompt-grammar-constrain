name: release-plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate distribution
        run: python3 scripts/package_plugin.py

      - name: Verify tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(
              Path("plugins/prompt-readiness-gate/.codex-plugin/plugin.json").read_text()
          )["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag must be {expected}")
          PY

      - name: Build archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="prompt-readiness-gate-${RELEASE_TAG}.zip"
          cd plugins
          zip -qr "../${archive}" prompt-readiness-gate
          cd ..
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="prompt-readiness-gate-${RELEASE_TAG}.zip"
          gh release create "${RELEASE_TAG}" "${archive}" "${archive}.sha256" \
            --generate-notes --verify-tag
