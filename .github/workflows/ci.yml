---
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install --disable-pip-version-check coverage ruff

      - name: Static checks
        run: |
          ruff check .agents/skills/prompt-readiness-gate
          ruff check scripts
          ruff format --check .agents/skills/prompt-readiness-gate
          ruff format --check scripts

      - name: Validate Skill and plugin distribution
        run: python scripts/package_plugin.py

      - name: Unit, property, metamorphic, and fuzz tests
        run: >-
          python -m unittest discover
          -s .agents/skills/prompt-readiness-gate/tests -v

      - name: Validate checked-in examples
        run: |
          python .agents/skills/prompt-readiness-gate/scripts/prompt_lint.py examples/ml-implement-v2.md
          python .agents/skills/prompt-readiness-gate/scripts/prompt_lint.py examples/ml-research-v2.md

      - name: Coverage gate
        if: matrix.python-version == '3.13'
        run: |
          coverage run --source=.agents/skills/prompt-readiness-gate/scripts \
            -m unittest discover -s .agents/skills/prompt-readiness-gate/tests
          coverage report --fail-under=95

      - name: Mutation benchmark
        if: matrix.python-version == '3.13'
        run: python .agents/skills/prompt-readiness-gate/tests/run_benchmark.py
