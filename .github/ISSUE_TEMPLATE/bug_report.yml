name: Validator bug
description: Report a false positive, false negative, crash, or unstable diagnostic.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private data, credentials, and identifying prompt content before submitting.
  - type: textarea
    id: prompt
    attributes:
      label: Minimal prompt
      description: Smallest prompt that reproduces the behavior.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include exact diagnostics, exit code, Python version, and revision.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract behavior
      description: Cite the relevant contract rule when possible.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, proprietary data, and personal information.
          required: true
